name: PR Preview

on:
  pull_request:
    branches: [ main, master, preview ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://jinks.pro/preview/
    steps:
      - name: Checkout repository with all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble composite site (main at /, PR head at /preview/)
        run: |
          mkdir -p _site _site/preview
          git archive origin/main | tar -x -C _site
          rm -rf _site/.claude _site/.github
          git archive HEAD | tar -x -C _site/preview
          rm -rf _site/preview/.claude _site/preview/.github _site/preview/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment PR with mobile-friendly preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 **Preview Available**')
            );

            const previewUrl = 'https://jinks.pro/preview/';
            const commentBody = `🚀 **Preview Available (Production \`https://jinks.pro/\` untouched)**\n\n📱 **Open on your phone:** **${previewUrl}**\n\nThis preview updates automatically with each new commit pushed to this PR.`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
